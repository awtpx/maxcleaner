[Settings]
; Interval between auto clean passes in seconds (Default: 300 = 5 minutes)
AutoCleanIntervalSeconds=300

; Enable automatic 5-minute cleaning (1 = Enabled, 0 = Disabled)
AutoCleanEnabled=1

; Enable background unnecessary app blocker (1 = Enabled, 0 = Disabled)
BlockerEnabled=1

; Automatically start Max Cleaner on Windows boot (1 = Enabled, 0 = Disabled)
StartWithWindows=1

; Clean Windows Recycle Bin during auto sweeps (1 = Yes, 0 = No)
CleanRecycleBin=1

; Clean Application Caches (Chrome, Edge, Brave, Firefox, Discord, Steam, Spotify) (1 = Yes, 0 = No)
; NOTE: Smart App-Aware Protection is active. If any browser or application is currently running,
; its cache and temp files will NOT be touched and remain safely intact in their folders.
; Caches are only purged when that specific application is closed.
CleanBrowserCaches=1

; Clean Windows Crash Dumps and Error Reports (1 = Yes, 0 = No)
CleanCrashDumps=1

; Minimum age in seconds before a temp file can be deleted (Safety threshold to protect active software sessions)
; Default: 14400 seconds (4 hours)
MinFileAgeSeconds=14400

[BlockedProcesses]
; Processes here will be safely suppressed/terminated if running in background.
; Add executable names (one per line, without path).
; Critical system processes (explorer, dwm, svchost, etc.) are strictly protected.
Process1=CompatTelRunner.exe
Process2=devicecensus.exe
Process3=wermgr.exe
Process4=gamebarftserver.exe
Process5=CCleaner64.exe
Process6=CCleanerReactivator.exe
Process7=OneDriveStandaloneUpdater.exe
Process8=MicrosoftEdgeUpdate.exe
Process9=GoogleUpdate.exe
Process10=jusched.exe
Process11=AdobeUpdateService.exe
Process12=AGSService.exe
Process13=mscorsvw.exe
Process14=CrashSender1403.exe
Process15=CrashSender1402.exe
